<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu Table</title>
</head>
<body>
    <table border="12" cellpadding="25" cellspacing="10">
        <tr>
        <th colspan="3">Today's Special Menu</th>
        </tr>
        <tr>
            <th>Category</th>
            <th>Food Item</th>
            <th>Price(₹)</th>
        </tr>
        <tr>
            <th rowspan="3">Starters</th>
            <td>spring rools</td>
            <td>120</td>
            <tr>
            <td>garlic bread</td>
            <td>100</td>
            </tr>
            <tr>
                <td>veg soup</td>
                <td>80</td>
            </tr>
        </tr>
        <tr>
            <th rowspan="3">Main Course</th>
            <td>paneer butter masala</td>
            <td>180</td>
            <tr>
                <td>veg biryani</td>
                <td>150</td>
            </tr>
            <tr>
                <td>Dal tadka</td>
                <td>120</td>
            </tr>
        </tr>
        <tr>
            <th rowspan="3">Desserts</th>
            <td>chocolate cake</td>
            <td>90</td>
            <tr>
                <td>ice-cream</td>
                <td>70</td>
                <tr>
                    <td>gulab jamun</td>
                    <td>60</td>

                </tr>
            </tr>
        </tr>
        <tr>
            <th rowspan="3">Drinks</th>
            <td>fresh lime soda</td>
            <td>50</td>
            <tr>
                <td>cold-coffee</td>
                <td>80</td>
                <tr>
                    <td>Mango shake</td>
                    <td>70</td>
                </tr>
            </tr>
        </tr>



    </table>
</body>
</html>
