<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Restaurant Menu</title>
</head>
<body>
    <h1>Welcome to Our Restaurant</h1>
    <h2>Click on a food item</h2>
    <img src="menu.jpg"  
    alt="Restaurant Menu" usemap="#menu" >
    <!----pizza-circle-->

        <area shape="circle" coords="207,339,229" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSyaJ-tBbWENKfcJb6E6ufG8stujXSbNnqAwDWVGuxibB2Qwworrq4iakU&s=10"

    alt="burger" target="_blank">

    <area shape="rectangle" coords="1027,704,1403,904" href="french fries.jpg"

    aly="cake" target="_blank">

</html>
