<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Explorer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #eaf6ff;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #164e75;
        }

        p {
            color: #333;
        }

        .map-container {
            max-width: 1000px;
            margin: 20px auto;
        }

        img {
            width: 100%;
            height: auto;
            display: block;
        }

        .links {
            margin-top: 20px;
        }

        .links a {
            display: inline-block;
            margin: 8px;
            padding: 10px 16px;
            background-color: #176b87;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .links a:hover {
            background-color: #10465a;
        }
    </style>
</head>

<body>

    <h1>🌍 World Explorer</h1>
    <p>Click a country below to explore it!</p>

    <div class="map-container">
        <img
            src="https://commons.wikimedia.org/wiki/Special:FilePath/BlankMap-World.svg"
            alt="World Map"
            usemap="#worldmap"
            width="1000"
            height="500"
        >

        <map name="worldmap">
            <!-- India -->
            <area shape="circle"
                  coords="650,280,35"
                  href="https://www.britannica.com/search?query=india"
                  alt="Explore India"
                  target="_blank">

            <!-- United States -->
            <area shape="rect"
                  coords="100,100,300,230"
                  href="https://en.wikipedia.org/wiki/United_States"
                  alt="Explore United States"
                  target="_blank">

            <!-- Australia -->
            <area shape="poly"
                  coords="700,350,750,360,770,400,740,430,700,410"
                  href="https://en.wikipedia.org/wiki/Australia"
                  alt="Explore Australia"
                  target="_blank">

            <!-- Default: Other areas -->
            <!--<area shape="default"
                  href="https://en.wikipedia.org/wiki/World"
                  alt="Explore the World"
                  target="_blank">--->
        </map>
    </div>

    <h2>Explore Countries</h2>

    <div class="links">
        <a href="https://en.wikipedia.org/wiki/India"
           target="_blank">India</a>

        <a href="https://en.wikipedia.org/wiki/United_States"
           target="_blank">United States</a>

        <a href="https://en.wikipedia.org/wiki/Australia"
           target="_blank">Australia</a>

        <a href="https://en.wikipedia.org/wiki/World"
           target="_blank">Explore the World</a>
    </div>

</body>
</html>
