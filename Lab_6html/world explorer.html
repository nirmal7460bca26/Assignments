<!DOCTYPE html>
<html>
<head>
    <title>World Map Explorer</title>
</head>
<body>

    <h1>World Map Explorer</h1>
    <p>Click on a country to explore more information.</p>

    <img src="https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg"
         alt="World Map"
         usemap="#worldmap"
         width="800">

    <map name="worldmap">

        <!-- Circle: India -->
        <area shape="circle"
              coords="530,300,35"
              href="https://www.britannica.com/search?query=india"
              alt="Explore India"
              target="_blank">

        <!-- Rectangle: USA -->
        <area shape="rect"
              coords="100,130,230,220"
              href="https://en.wikipedia.org/wiki/United_States"
              alt="Explore United States"
              target="_blank">

        <!-- Polygon: Australia -->
        <area shape="poly"
              coords="630,380,700,360,740,400,710,440,650,430"
              href="https://en.wikipedia.org/wiki/Australia"
              alt="Explore Australia"
              target="_blank">

        <!-- Default: Other areas -->
        <area shape="default"
              href="https://www.britannica.com/place/world"
              alt="Explore the world"
              target="_blank">

    </map>

</body>
</html>
