<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Course Registration Form</title>
</head>
<body>
    <form>
        <lable>Student Name</lable>
        <input type="text" required><br>
        <label>Email Address</label>
        <input required><br>
        <lable>Mobile Number</lable>
        <input type="text" required><br>
        <label>Age</label>
        <input required>
        <label>Password</label>
        <input required>
        <label>Gender</label><br>
        <input type="radio" name="12" value="Male" required>
        <label>Male</label><br>
        <input type="radio" name="12" value="Female" required>
        <lable>Female</lable><br>
        <input type="radio" name="12" value="Other" required>
        <lable>Other</lable><br>
        <label>Skills</label>
        <select>
            <option>HTML</option>
            <option>CSS</option>
            <option>JavaScript</option>
            <option>Python</option>
        </select>
        <input required><br>

        <label>Course</label>
        <select>
            <option>Web Development</option>
            <option>Python Programming</option>
            <option>Data Analytics</option>
            <option>Digital Marketing</option>
        </select>
        <input required>
        <input type="hidden" value="online course resistration"><br>
        <label>Date of Birth</label>
        <input type="date"><br>
        <label>Preferred Class Time</label>
        <input type="time"><br>


        <input type="submit">
        <input type="reset">
    </form>
</body>
</html>
